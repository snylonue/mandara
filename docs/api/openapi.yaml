openapi: 3.1.0
info:
  title: Bookshelf API
  version: 0.1.0
  description: |
    Bookshelf is a self-hosted light-novel reading server.

    This document is the single source of truth for the HTTP API contract:
    the backend implements it and the frontend generates its types from it
    (see `frontend/package.json`, script `api-types`).

    Model overview: `books` are pure metadata entries; `book_files` are the
    actual books (uploads or virtual plugin books). Several files can share
    one metadata entry. Chapters, reading sessions and shares attach to
    files. Every file is either `private` (owner + admins only) or `public`
    (all logged-in users).

    Auth is optional: with `BOOKSHELF_AUTH_ENABLED=false` the server runs as
    a single local admin and all endpoints behave as if authenticated.
servers:
  - url: http://127.0.0.1:8080
    description: Local development server (default)
tags:
  - name: auth
    description: User registration and login
  - name: health
    description: Service status
  - name: books
    description: Book metadata
  - name: files
    description: Book files (uploads & plugin books), chapters, reading
  - name: sessions
    description: Reading sessions (per-user, per-file)
  - name: shares
    description: Public share links (anonymous read / progress follow)
  - name: plugins
    description: wasm plugin sources

paths:
  /api/health:
    get:
      tags: [health]
      summary: Service health and capabilities
      operationId: getHealth
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Registered, token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Registration is disabled
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in, receive a JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in, token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/plugins:
    get:
      tags: [plugins]
      summary: List registered plugin instances (id, wasm file, name, capabilities)
      operationId: listPlugins
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registered instances in creation order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PluginInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/plugins/wasm-files:
    get:
      tags: [plugins]
      summary: Basenames of the compiled wasm components loaded at startup (admin only)
      operationId: wasmFiles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wasm file basenames, e.g. ["wiki.wasm", "reader.wasm"]
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/plugins/sync:
    post:
      tags: [plugins]
      summary: Re-sync the catalogs of every enabled declare-capable instance (admin only)
      operationId: syncPlugins
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Number of books (re-)synced
          content:
            application/json:
              schema:
                type: object
                required: [synced]
                properties:
                  synced:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/plugins/instances:
    post:
      tags: [plugins]
      summary: |
        Register a plugin instance (admin only). `wasm_file` must be a
        basename returned by GET /api/plugins/wasm-files; `config` is
        validated against the plugin's config schema (defaults fill the
        rest). An explicit `id` becomes the source id used in
        `book_files.source` — stable ids let metadata plugins point their
        `content-source` at a content plugin's instance. A declare-capable
        instance is synced right away.
      operationId: registerInstance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wasm_file]
              properties:
                id:
                  type: string
                  description: 'Explicit instance id (default: generated uuid)'
                wasm_file:
                  type: string
                config:
                  type: object
                  description: Config values keyed by schema field keys
      responses:
        "201":
          description: The registered instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/plugins/instances/{id}:
    delete:
      tags: [plugins]
      summary: Delete a plugin instance (admin only)
      operationId: deleteInstance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "204":
          description: Instance deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Files still reference the instance (delete them first)
          content:
            application/json:
              schema:
                type: object
                required: [error, files]
                properties:
                  error:
                    type: string
                  files:
                    type: array
                    items:
                      type: string

  /api/plugins/instances/{id}/enabled:
    put:
      tags: [plugins]
      summary: |
        Enable or disable a plugin instance (admin only). Disabling stops
        sync/browse/materialize; already materialized chapters stay
        readable.
      operationId: setInstanceEnabled
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: The updated instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plugins/{id}/config-schema:
    get:
      tags: [plugins]
      summary: Config schema plus current values for the admin form (admin only)
      operationId: pluginConfigSchema
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: Schema fields and the stored (validated) config values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSchema"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plugins/{id}/config:
    put:
      tags: [plugins]
      summary: |
        Validate and store an instance's configuration (admin only).
        Unknown keys are rejected, required fields enforced, enum indices
        range-checked; errors come back field-by-field for inline form
        display. A declare-capable instance is re-synced after the change.
      operationId: putPluginConfig
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  type: object
                  description: Config values keyed by schema field keys
      responses:
        "200":
          description: The updated instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plugins/{id}/search:
    get:
      tags: [plugins]
      summary: |
        Paginated catalog search of a search-capable instance. The library
        does not enumerate large sources; users pick books here and add
        them through the unified acquisition endpoint (POST /api/books
        with plugin_source + plugin_book_id). Caps: limit 1..50,
        offset <= 10000.
      operationId: searchPlugins
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
        - name: q
          in: query
          description: Free-text query (empty = page through everything)
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            maximum: 10000
      responses:
        "200":
          description: Search page, entries annotated with their library book id when already materialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/books:
    get:
      tags: [books]
      summary: List visible books with their visible files
      operationId: listBooks
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Substring match on book title
          required: false
          schema:
            type: string
        - name: source
          in: query
          description: Filter by file source ('local' or a plugin id)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Metadata entries that own at least one visible file
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookListEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [books]
      summary: |
        Add a book to the library — the single acquisition flow
        (获取书籍 → 添加元数据). The content is either an uploaded
        `file` or a plugin book (`plugin_source` + `plugin_book_id`
        without a `file`; the plugin supplies the book file via
        `get-book-file` when available, otherwise chapters materialize
        lazily). The metadata entry is created automatically (parsed
        from the file / the plugin's own entry), taken from a plugin
        catalog, or attached to an existing entry (`book_id`).
        `title`/`authors`/`description`/`cover_url` override the produced
        metadata (manual mode; never applied when attaching).
      operationId: uploadBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    Epub or txt file — the content. Mutually exclusive
                    with `plugin_source` + `plugin_book_id` (plugin
                    content): exactly one content source is required.
                    When given together with `plugin_source`, the file is
                    the content and the plugin only supplies the metadata.
                visibility:
                  type: string
                  enum: [private, public]
                  default: private
                  description: Choose whether this file is published
                label:
                  type: string
                  description: Short human label for this edition (e.g. "proofread")
                book_id:
                  type: string
                  description: |
                    Attach the content to this existing metadata entry
                    instead of creating one. The caller must be able to
                    see the book. Mutually exclusive with the plugin
                    metadata modes (a plugin book attached this way must
                    not already be materialized under another entry).
                plugin_source:
                  type: string
                  description: |
                    Together with `plugin_book_id`: the metadata comes
                    from this plugin source's catalog. Without a `file`,
                    the plugin is also the content source (the book is
                    materialized into the library).
                plugin_book_id:
                  type: string
                  description: Id of the book inside the plugin's catalog
                title:
                  type: string
                  description: "Manual metadata: overrides the title (auto mode uses the parsed/identified one)"
                authors:
                  type: string
                  description: 'Manual metadata: JSON string array, e.g. `["A","B"]`'
                description:
                  type: string
                  description: "Manual metadata: overrides the description"
                cover_url:
                  type: string
                  description: "Manual metadata: cover image URL"
      responses:
        "201":
          description: Book and its first file created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/books/{id}:
    get:
      tags: [books]
      summary: Book metadata plus files visible to the caller
      operationId: getBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Book detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [books]
      summary: Edit metadata (creator or admin)
      operationId: patchBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBook"
      responses:
        "200":
          description: Updated metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookMeta"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [books]
      summary: |
        Delete the metadata entry (creator or admin). Metadata and file
        deletion are distinct operations: deleting files never touches the
        metadata and deleting metadata only succeeds once every file has
        been deleted explicitly.
      operationId: deleteBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Book still has files; delete them first
          content:
            application/json:
              schema:
                type: object
                required: [error, files]
                properties:
                  error:
                    type: string
                  files:
                    type: array
                    description: Ids of the files still attached to the book
                    items:
                      type: string

  /api/books/{id}/cover:
    get:
      tags: [books]
      summary: |
        Serve the stored cover image bytes (extracted from an uploaded
        epub). Unauthenticated on purpose: `<img>` elements cannot send
        the Authorization header, and book ids are unguessable uuids
        (same capability-like model as share tokens). Books without a
        stored cover answer 404 so callers fall back to a placeholder.
      operationId: getBookCover
      security: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: The cover image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/books/{id}/refresh:
    post:
      tags: [books]
      summary: |
        Update metadata from the book's plugin source(s) (creator or
        admin). Re-pulls title/authors/description/cover-url and refreshes
        the plugin file's chapter titles; materialized chapter content is
        never overwritten.
      operationId: refreshBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Metadata refreshed from the plugin source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookMeta"
        "400":
          description: Book has no plugin source (or the source is not loaded)
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/books/{id}/files:
    post:
      tags: [books]
      summary: Attach another file (format/edition) to existing metadata
      operationId: attachFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                visibility:
                  type: string
                  enum: [private, public]
                  description: |
                    Defaults to the most visible existing file of the book
                    (private if the book has no visible files yet)
                label:
                  type: string
      responses:
        "201":
          description: Attached file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/files/{id}:
    get:
      tags: [files]
      summary: File detail with chapter titles and its book metadata
      operationId: getFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File detail (plugin chapter titles materialized lazily)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [files]
      summary: Toggle visibility or rename the edition label (owner or admin)
      operationId: patchFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchFile"
      responses:
        "200":
          description: Updated file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMeta"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [files]
      summary: Delete a file (owner or admin)
      operationId: deleteFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/files/{id}/chapters/{idx}:
    get:
      tags: [files]
      summary: Fetch one chapter's content
      operationId: getChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - name: idx
          in: path
          required: true
          description: Zero-based chapter index
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Chapter content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/files/{id}/content-source:
    post:
      tags: [files]
      summary: |
        Rebind a file's chapter source (owner/admin only; metadata/content
        separation). The target instance must exist; when it has the
        `lookup` capability the book must resolve via get-book. Existing
        chapter bodies are cleared and re-materialized from the new source
        on next read; title placeholders refresh from the new source.
      operationId: setContentSource
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_source]
              properties:
                content_source:
                  description: Target plugin instance id (must exist)
                  type: string
                content_external_id:
                  description: 'Book id inside the content source (default: the file''s external_id)'
                  type: string
      responses:
        "200":
          description: The updated file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/files/{id}/sessions:
    get:
      tags: [sessions]
      summary: Current user's reading sessions for a file
      operationId: listSessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Sessions of the caller for this file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [sessions]
      summary: Create a session (reuses an existing one with the same label)
      operationId: createSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSession"
      responses:
        "201":
          description: Created (or the existing session with that label)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/sessions/{id}:
    put:
      tags: [sessions]
      summary: Update session progress (all fields optional; clamped)
      operationId: updateSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Session id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePosition"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [sessions]
      summary: Delete a session (owner or admin)
      operationId: deleteSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/files/{id}/shares:
    post:
      tags: [shares]
      summary: Create a share link for a file or one of its sessions
      operationId: createShare
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShare"
      responses:
        "201":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/shares/{token}:
    get:
      tags: [shares]
      summary: Public share info (no auth; session progress snapshot)
      operationId: getShare
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Share snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareView"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [shares]
      summary: Delete a share (creator or admin)
      operationId: deleteShare
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/shares/{token}/book:
    get:
      tags: [shares]
      summary: "Anonymous read: book, file and chapter titles"
      operationId: shareBook
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Book + file + chapter titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareBookResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/shares/{token}/chapters/{idx}:
    get:
      tags: [shares]
      summary: "Anonymous read: one chapter"
      operationId: shareChapter
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: idx
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Chapter content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    BookId:
      name: id
      in: path
      required: true
      description: Book (metadata) id
      schema:
        type: string
    FileId:
      name: id
      in: path
      required: true
      description: Book file id
      schema:
        type: string
    ShareToken:
      name: token
      in: path
      required: true
      description: Share token
      schema:
        type: string
    PluginId:
      name: id
      in: path
      required: true
      description: Plugin instance id (source id)
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Structured config validation errors (field-by-field for inline form display)
      content:
        application/json:
          schema:
            type: object
            required: [error, errors]
            properties:
              error:
                type: string
              errors:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigError"
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist (or share expired)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Health:
      type: object
      required: [status, version, auth_enabled, allow_register]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        auth_enabled:
          type: boolean
          description: false = single-user local mode
        allow_register:
          type: boolean

    Role:
      type: string
      enum: [admin, user]

    User:
      type: object
      required: [id, username, role, created_at]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string

    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 'JWT (send as `Authorization: Bearer <token>`)'
        user:
          $ref: "#/components/schemas/User"

    Visibility:
      type: string
      enum: [private, public]

    BookMeta:
      type: object
      required: [id, title, authors, description, cover_url, created_by, created_at]
      properties:
        id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        description:
          type: [string, "null"]
        cover_url:
          type: [string, "null"]
        created_by:
          description: Id of the user who created this metadata entry
          type: [string, "null"]
        created_at:
          type: string

    FileMeta:
      type: object
      required:
        - id
        - book_id
        - source
        - external_id
        - content_source
        - content_external_id
        - format
        - label
        - visibility
        - owner_id
        - chapter_count
        - created_at
      properties:
        id:
          type: string
        book_id:
          type: string
        source:
          description: "'local' for uploads, otherwise the plugin id"
          type: string
        external_id:
          description: Id within the source (same as `id` for local files)
          type: string
        content_source:
          description: |
            Instance id whose chapters back this file when different from
            `source` (metadata/content source separation); null = `source`.
          type: string
          nullable: true
        content_external_id:
          description: |
            Book id inside the content source; null = `external_id`.
          type: string
          nullable: true
        format:
          type: string
          enum: [epub, txt, plugin]
        label:
          description: Short human label for this edition
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        owner_id:
          type: [string, "null"]
        chapter_count:
          type: integer
        created_at:
          type: string

    ChapterMeta:
      type: object
      required: [idx, title]
      properties:
        idx:
          type: integer
        title:
          type: string

    TocNode:
      type: object
      description: >-
        One node of the hierarchical table of contents. `idx` is the
        chapter index this entry points to (`null` for pure group nodes);
        leaf entries reference entries of the `chapters` list.
      required: [title, idx, children]
      properties:
        title:
          type: string
        idx:
          type: [integer, "null"]
        frag:
          type: string
          nullable: true
          description: >
            Id fragment of the source href (`file.html#section`) when this
            entry points into the middle of its chapter; the reader
            scrolls to the element with that id.
        children:
          type: array
          items:
            $ref: "#/components/schemas/TocNode"

    Chapter:
      type: object
      required: [idx, title, format, content]
      properties:
        idx:
          type: integer
        title:
          type: string
        format:
          type: string
          enum: [html, text]
          description: >-
            `html`: sanitized HTML fragment (epub chapters, structure
            preserved, images inlined as data URIs). `text`: plain text
            (txt uploads, plugin chapters).
        content:
          type: string
          description: Chapter content per `format`.

    Position:
      type: object
      required: [chapter_idx, offset, fraction]
      properties:
        chapter_idx:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
          description: Character offset within the chapter (non-web readers)
        fraction:
          type: number
          minimum: 0
          maximum: 1
          description: Scroll fraction within the chapter (web reader)

    BookDetail:
      type: object
      required: [book, files]
      properties:
        book:
          $ref: "#/components/schemas/BookMeta"
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileMeta"

    BookListEntry:
      type: object
      required: [book, files]
      properties:
        book:
          $ref: "#/components/schemas/BookMeta"
        files:
          description: Files of this book visible to the caller
          type: array
          items:
            $ref: "#/components/schemas/FileMeta"

    FileDetail:
      type: object
      required: [file, book, chapters, toc]
      properties:
        file:
          $ref: "#/components/schemas/FileMeta"
        book:
          $ref: "#/components/schemas/BookMeta"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ChapterMeta"
        toc:
          type: array
          items:
            $ref: "#/components/schemas/TocNode"

    PatchBook:
      type: object
      properties:
        title:
          type: string
        description:
          type: string

    PatchFile:
      type: object
      properties:
        visibility:
          $ref: "#/components/schemas/Visibility"
        label:
          type: string

    ReadingSession:
      type: object
      required: [id, user_id, file_id, label, position, updated_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        file_id:
          type: string
        label:
          type: string
        position:
          $ref: "#/components/schemas/Position"
        updated_at:
          type: string

    SessionsResponse:
      type: object
      required: [file_id, book_title, sessions]
      properties:
        file_id:
          type: string
        book_title:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ReadingSession"

    CreateSession:
      type: object
      properties:
        label:
          type: string
          maxLength: 64
          description: Defaults to "default"

    UpdatePosition:
      type: object
      properties:
        chapter_idx:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        fraction:
          type: number
          minimum: 0
          maximum: 1

    ShareKind:
      type: string
      enum: [book, session]

    CreateShare:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/ShareKind"
        session_id:
          type: string
          description: Required when kind is "session"
        expires_days:
          type: integer
          minimum: 1

    ShareResponse:
      type: object
      required:
        - token
        - url
        - kind
        - mode
        - file_id
        - session_id
        - expires_at
        - created_at
      properties:
        token:
          type: string
        url:
          description: Frontend path of the share page
          type: string
        kind:
          $ref: "#/components/schemas/ShareKind"
        mode:
          type: string
          enum: [read, progress]
        file_id:
          type: string
        session_id:
          type: [string, "null"]
        expires_at:
          type: [string, "null"]
        created_at:
          type: string

    ShareBookView:
      type: object
      required: [id, title, authors, description]
      properties:
        id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        description:
          type: [string, "null"]

    ShareFileView:
      type: object
      required: [id, format, label, chapter_count]
      properties:
        id:
          type: string
        format:
          type: string
        label:
          type: string
        chapter_count:
          type: integer

    ShareSessionView:
      type: object
      required: [id, label, owner_username, position, percent, updated_at]
      properties:
        id:
          type: string
        label:
          type: string
        owner_username:
          type: string
        position:
          $ref: "#/components/schemas/Position"
        percent:
          type: integer
          description: Progress within the current chapter, 0..100
        updated_at:
          type: string

    ShareView:
      type: object
      required: [kind, mode, book, file, session, created_at, expires_at]
      properties:
        kind:
          $ref: "#/components/schemas/ShareKind"
        mode:
          type: string
          enum: [read, progress]
        book:
          $ref: "#/components/schemas/ShareBookView"
        file:
          $ref: "#/components/schemas/ShareFileView"
        session:
          oneOf:
            - $ref: "#/components/schemas/ShareSessionView"
            - type: "null"
          description: Present when kind is "session"
        created_at:
          type: string
        expires_at:
          type: [string, "null"]

    ShareBookResponse:
      type: object
      required: [book, file, chapters, toc]
      properties:
        book:
          $ref: "#/components/schemas/ShareBookView"
        file:
          $ref: "#/components/schemas/ShareFileView"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ChapterMeta"
        toc:
          type: array
          items:
            $ref: "#/components/schemas/TocNode"

    PluginInstance:
      description: One registered plugin instance (source id = `id`)
      type: object
      required: [id, wasm_file, name, enabled, capabilities, source_info]
      properties:
        id:
          description: Source id used in `book_files.source`
          type: string
        wasm_file:
          description: Basename of the wasm component backing this instance
          type: string
        name:
          description: Human-readable plugin name (from the plugin itself)
          type: string
        enabled:
          type: boolean
        capabilities:
          description: >-
            Subset of [declare, search, lookup, identify, content, book-file].
            book-file instances materialize whole book files through the
            upload parser (file mode wins over chapter mode).
          type: array
          items:
            type: string
        source_info:
          description: |
            Interaction hints declared by the plugin (`source-info` export):
            how the frontend should present this source when acquiring
            books. `kind` = "search" | "manual-id" | "browse" | ""
            (empty = derive from capabilities).
          type: object
          required: [kind, id_kind]
          properties:
            kind:
              type: string
            id_kind:
              type: string
            id_hint:
              type: string
              nullable: true
            search_hint:
              type: string
              nullable: true

    ConfigField:
      description: One field of a plugin's configuration schema
      type: object
      required: [key, label, kind, required]
      properties:
        key:
          type: string
        label:
          description: zh-CN display label for the admin form
          type: string
        kind:
          type: string
          enum: [string, number, boolean, enum, list-of-string]
        options:
          description: Enum options (kind=enum); index is the stored value
          type: array
          items:
            type: string
        default:
          description: Serialized default value (JSON)
          type: string
          nullable: true
        required:
          type: boolean
        hint:
          type: string
          nullable: true

    ConfigSchema:
      description: Plugin config schema plus the stored values, for the admin form
      type: object
      required: [fields, config]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ConfigField"
        config:
          description: Current validated values keyed by field key
          type: object

    ConfigError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    PluginSearchItem:
      description: One search hit, annotated with the library book it is already synced into
      type: object
      required: [id, title, authors, book_id]
      properties:
        id:
          description: Book id inside the source
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true
        cover_url:
          type: string
          nullable: true
        book_id:
          description: Library metadata entry already materialized for this book, if any
          type: string
          nullable: true

    PluginSearchResponse:
      type: object
      required: [total, items]
      properties:
        total:
          description: Source-side total match count (may be capped by the source)
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/PluginSearchItem"
