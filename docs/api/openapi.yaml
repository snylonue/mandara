openapi: 3.1.0
info:
  title: Mandara API
  version: 0.1.0
  description: |
    Mandara is a self-hosted light-novel reading server.

    This document is the single source of truth for the HTTP API contract:
    the backend implements it and the frontend generates its types from it
    (see `frontend/package.json`, script `api-types`).

    Model overview: `books` are pure metadata entries; `book_files` are the
    actual books (uploads or virtual plugin books). Several files can share
    one metadata entry. Chapters, reading progress and shares attach to
    files. Each user-wide reading session holds independent progress for
    every file. Uploaded files may be `private` (owner + admins only) or
    `public` (all logged-in users). Plugin content is always `public`, including
    plugin-provided EPUB/TXT files; only locally uploaded files may be private.

    Protected endpoints authenticate requests before parsing path, query,
    or body data. Missing, invalid, or expired credentials and deleted
    accounts return 401; authenticated users without the required role
    return 403, even when the request data is malformed. Roles are checked
    against the current database user, not the role stored in the JWT.
servers:
  - url: http://127.0.0.1:8080
    description: Local development server (default)
tags:
  - name: auth
    description: User registration and login
  - name: health
    description: Service status
  - name: books
    description: Book metadata
  - name: files
    description: Book files (uploads & plugin books), chapters, reading
  - name: sessions
    description: User-wide reading contexts and per-file progress
  - name: shares
    description: Public share links (anonymous read / progress follow)
  - name: plugins
    description: wasm plugin sources

paths:
  /api/health:
    get:
      tags: [health]
      summary: Service health and capabilities
      operationId: getHealth
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Registered, token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Registration is disabled
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in, receive a JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in, token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user (Authorization header or session cookie)
      operationId: me
      security:
        - bearerAuth: []
      description: |
        The authenticated user. Accepts the JWT via `Authorization:
        Bearer …` or via the `mandara_token` session cookie (set on
        register/login) — the cookie keeps the login alive across page
        refreshes.
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: "Clear the session cookie (stateless JWT: nothing else to invalidate)"
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session cookie cleared

  /api/plugins:
    get:
      tags: [plugins]
      summary: List registered plugin instances (id, wasm file, name, capabilities)
      operationId: listPlugins
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registered instances in creation order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PluginInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/plugins/wasm-files:
    get:
      tags: [plugins]
      summary: Basenames of the compiled wasm components loaded at startup (admin only)
      operationId: wasmFiles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wasm file basenames, e.g. ["wiki.wasm", "reader.wasm"]
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/plugins/sync:
    post:
      tags: [plugins]
      summary: Re-sync the catalogs of every enabled declare-capable instance (admin only)
      operationId: syncPlugins
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Number of books (re-)synced
          content:
            application/json:
              schema:
                type: object
                required: [synced]
                properties:
                  synced:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/plugins/instances:
    post:
      tags: [plugins]
      summary: |
        Register a plugin instance (admin only). `wasm_file` must be a
        basename returned by GET /api/plugins/wasm-files. Registration creates
        an instance with empty configuration; configuration is entered and
        validated separately through PUT /api/plugins/{id}/config.
        An explicit `id` becomes the source id used in
        `book_files.source`; metadata and content sources are selected by
        the user, not linked by plugin entries. A declare-capable
        instance is synced right away.
      operationId: registerInstance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wasm_file]
              properties:
                id:
                  type: string
                  description: 'Explicit instance id (default: generated uuid)'
                wasm_file:
                  type: string
      responses:
        "201":
          description: The registered instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/plugins/instances/{id}:
    delete:
      tags: [plugins]
      summary: Delete a plugin instance (admin only)
      operationId: deleteInstance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "204":
          description: Instance deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Files still reference the instance (delete them first)
          content:
            application/json:
              schema:
                type: object
                required: [error, files]
                properties:
                  error:
                    type: string
                  files:
                    type: array
                    items:
                      type: string

  /api/plugins/instances/{id}/enabled:
    put:
      tags: [plugins]
      summary: |
        Enable or disable a plugin instance (admin only). Disabling stops
        sync/browse/materialize; already materialized chapters stay
        readable.
      operationId: setInstanceEnabled
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: The updated instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plugins/instances/{id}/sync:
    post:
      tags: [plugins]
      summary: Re-catalogue one plugin instance (admin only)
      description: |
        Re-sync the declared catalog of a single instance into the library
        (the per-instance 重同步 button in the admin page; the full sync
        is POST /api/plugins/sync).
      operationId: syncInstance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: Number of books (re-)synced for the instance
          content:
            application/json:
              schema:
                type: object
                required: [synced]
                properties:
                  synced:
                    type: integer
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plugins/{id}/config-schema:
    get:
      tags: [plugins]
      summary: Config schema plus current values for the admin form (admin only)
      operationId: pluginConfigSchema
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: Schema fields and the stored (validated) config values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSchema"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plugins/{id}/config:
    put:
      tags: [plugins]
      summary: |
        Validate and store an instance's configuration (admin only).
        Unknown keys are rejected, required fields enforced, enum indices
        range-checked; errors come back field-by-field for inline form
        display. A declare-capable instance is re-synced after the change.
      operationId: putPluginConfig
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  type: object
                  description: Config values keyed by schema field keys
      responses:
        "200":
          description: The updated instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plugins/{id}/content:
    get:
      tags: [plugins]
      summary: Preview an independently identified content item without importing it
      description: |
        Ask an enabled plugin for its content declaration. Returns identity,
        loading form and chapter count only; no book, file, chapter or download
        job is created. A metadata ID may be tried as a candidate, but availability
        must be confirmed here rather than inferred from source capabilities.
        Metadata and content IDs are independent; a 404 does not imply missing metadata.
      operationId: previewPluginContent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1}
          description: Opaque candidate content ID
      responses:
        "200":
          description: The content declaration preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginContentPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plugins/{id}/lookup:
    get:
      tags: [plugins]
      summary: Resolve a plugin book or series ID without acquiring it
      description: Returns one independently addressable book, or the books belonging to a series. IDs are opaque plugin-defined values, not necessarily upstream website IDs.
      operationId: lookupPlugin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved books available for individual selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plugins/{id}/series:
    get:
      tags: [plugins]
      summary: Resolve a series and preview its independently addressable members
      description: Resolves get-series directly, without treating a member book as a series or acquiring anything. The returned series ID is canonical within this plugin instance.
      operationId: lookupPluginSeries
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Series metadata and available member books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSeriesLookupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [plugins]
      summary: Import series metadata and explicitly selected member book metadata
      description: |
        Reuses series and book metadata by plugin-instance provenance. Only the
        requested member books are added; an empty book_ids creates just the
        series. No content files or chapters are acquired, even for a content
        source. All selected IDs must be distinct members of this series and
        resolve via get-book before any metadata is written.
      operationId: importPluginSeries
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPluginSeries"
      responses:
        "201":
          description: Created or refreshed series, including its current library member count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesBrief"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plugins/{id}/search:
    get:
      tags: [plugins]
      summary: |
        Paginated catalog search of a search-capable instance. The library
        does not enumerate large sources; users pick books here and add
        them through the unified acquisition endpoint (POST /api/books
        with plugin_source + plugin_book_id). Caps: limit 1..50,
        offset <= 10000.
      operationId: searchPlugins
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
        - name: q
          in: query
          description: Free-text query (empty = page through everything)
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            maximum: 10000
      responses:
        "200":
          description: Search page, entries annotated with their library book id when already materialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/books:
    get:
      tags: [books]
      summary: List visible books with their visible files
      operationId: listBooks
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Substring match on book title
          required: false
          schema:
            type: string
        - name: source
          in: query
          description: Filter by file source ('local' or a plugin id)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Metadata entries with at least one visible file, plus metadata-only entries (no files yet) the caller owns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [books]
      summary: |
        Add a book to the library — the single acquisition flow
        (获取书籍 → 添加元数据). The content is either an uploaded
        `file`, a plugin book (`plugin_source` + `plugin_book_id`
        without a `file`; `get-content` declares the content identity,
        loading form and chapter list. Chapter-mode declarations are saved
        with the content at creation, and missing bodies download in the
        background. File-mode content is parsed and saved at creation),
        or none (`metadata_only`: a bare metadata entry — add
        the content later by attaching a file/plugin book to it). The
        metadata entry is created automatically (parsed from the file /
        the plugin's own entry), taken from a plugin catalog
        (`meta_plugin_source` + `meta_plugin_book_id`), attached to an
        existing entry (`book_id`), or described manually. The metadata
        source is independent of the content source: metadata may come
        from plugin A while the content comes from plugin B.
        `title`/`authors`/`description`/`cover_url`/`ext` override the
        produced metadata (never applied when attaching). One plugin book
        is one volume. Parent series metadata groups independently identified
        books; the host never slices a flat chapter list or matches volume
        counts across sources. Select a specific volume in the source picker.
      operationId: uploadBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    Epub or txt file — the content. Mutually exclusive
                    with `plugin_source` + `plugin_book_id` (plugin
                    content) and with `metadata_only`: exactly one content
                    source is used. When given together with
                    `plugin_source`, the file is the content and the
                    plugin only supplies the metadata.
                metadata_only:
                  type: boolean
                  default: false
                  description: |
                    Create a bare metadata entry without any content
                    (no file is created). `meta_plugin_source` +
                    `meta_plugin_book_id` name the metadata source
                    (catalog entry), or `title`/`authors`/… describe the
                    entry manually (a title is required). Content may be
                    attached later via `POST /api/books/{id}/files`.
                visibility:
                  type: string
                  enum: [private, public]
                  description: |
                    Uploads default to private and may choose either visibility.
                    Plugin content defaults to public; requesting private returns 400.
                    Metadata-only additions create no file, so visibility has no effect.
                label:
                  type: string
                  description: Short human label for this edition (e.g. "proofread")
                book_id:
                  type: string
                  description: |
                    Attach the content to this existing metadata entry
                    instead of creating one. The caller must be able to
                    see the book. Mutually exclusive with the plugin
                    metadata modes. Content reuse is scoped to this book.
                plugin_source:
                  type: string
                  description: |
                    Together with `plugin_book_id`: the *content* comes
                    from this plugin source's content ID. Its independent
                    `get-content` declares loading and chapter information together;
                    content acquisition does not call `get-book`. The response
                    does not wait for all chapter bodies. When no `file`,
                    `meta_plugin_source`, or `book_id` is given, the
                    plugin's own entry also provides the metadata.
                plugin_book_id:
                  type: string
                  description: Opaque content ID accepted by the content exports, independent of metadata IDs
                meta_plugin_source:
                  type: string
                  description: |
                    Together with `meta_plugin_book_id`: the metadata
                    comes from this plugin source's catalog — possibly a
                    different plugin than the content source. Overrides
                    (`title`/…) apply on top of its entry.
                meta_plugin_book_id:
                  type: string
                  description: Id of the metadata book inside its plugin's catalog
                title:
                  type: string
                  description: "Manual metadata: overrides the title (auto mode uses the parsed/identified one)"
                authors:
                  type: string
                  description: 'Manual metadata: JSON string array, e.g. `["A","B"]`'
                description:
                  type: string
                  description: "Manual metadata: overrides the description"
                cover_url:
                  type: string
                  description: "Manual metadata: cover image URL"
                ext:
                  type: string
                  description: |
                    Manual metadata: extended fields as a JSON object
                    (see `BookExt`), e.g.
                    `{"isbn":"9787536692930","publisher":"出版社"}`.
                    Overrides the parsed/identified value per-key.
      responses:
        "201":
          description: |
            The created series (when a multi-volume source book was
            parent grouping) and the acquired book, with its first file
            (empty files array for a metadata-only addition).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquireResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/books/{id}:
    get:
      tags: [books]
      summary: Book metadata plus files visible to the caller
      operationId: getBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Book detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [books]
      summary: Edit metadata (creator or admin)
      operationId: patchBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBook"
      responses:
        "200":
          description: Updated metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookMeta"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [books]
      summary: |
        Delete the metadata entry (creator or admin). Metadata and file
        deletion are distinct operations: deleting files never touches the
        metadata and deleting metadata only succeeds once every file has
        been deleted explicitly.
      operationId: deleteBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Book still has files; delete them first
          content:
            application/json:
              schema:
                type: object
                required: [error, files]
                properties:
                  error:
                    type: string
                  files:
                    type: array
                    description: Ids of the files still attached to the book
                    items:
                      type: string

  /api/books/{id}/cover:
    get:
      tags: [books]
      summary: |
        Serve the stored cover image bytes (extracted from an uploaded
        epub). Unauthenticated on purpose: `<img>` elements cannot send
        the Authorization header, and book ids are unguessable uuids
        (same capability-like model as share tokens). Books without a
        stored cover answer 404 so callers fall back to a placeholder.
      operationId: getBookCover
      security: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: The cover image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/books/{id}/refresh:
    post:
      tags: [books]
      summary: |
        Update metadata from the book's recorded metadata source (creator
        or admin). Re-pulls title/authors/description/cover-url from that
        source only and refreshes each plugin file's chapter titles from
        its own content source; materialized chapter content is never
        overwritten. A book whose metadata came from plugin A but holds
        files from plugin B is refreshed without B ever overwriting A's
        metadata.
      operationId: refreshBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Metadata refreshed from the plugin source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookMeta"
        "400":
          description: Book has no plugin source (or the source is not loaded)
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/books/{id}/files:
    post:
      tags: [books]
      summary: Attach another file (format/edition) to existing metadata
      operationId: attachFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                visibility:
                  type: string
                  enum: [private, public]
                  description: |
                    Defaults to the most visible existing file of the book
                    (private if the book has no visible files yet)
                label:
                  type: string
      responses:
        "201":
          description: Attached file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/series:
    get:
      tags: [series]
      summary: |
        List series visible to the caller: those created by the caller,
        and series owning at least one visible member file (admins see
        all). Each entry carries its member count.
      operationId: listSeries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Visible series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeriesBrief"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [series]
      summary: Create a series (any logged-in user; the creator manages it)
      operationId: createSeries
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                authors:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                ext:
                  $ref: "#/components/schemas/SeriesExt"
      responses:
        "201":
          description: Created series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesBrief"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/series/{id}:
    get:
      tags: [series]
      summary: |
        Series detail: metadata plus member books in volume order (files
        filtered by visibility; entries without visible files still
        appear with an empty `files` list).
      operationId: getSeriesDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "200":
          description: Series detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [series]
      summary: Edit series metadata (creator or admin)
      operationId: patchSeries
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                authors:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                ext:
                  description: Extended-metadata merge patch (absent = keep, null = clear, value = set)
                  $ref: "#/components/schemas/SeriesExt"
      responses:
        "200":
          description: Updated series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesBrief"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [series]
      summary: |
        Delete a series (creator or admin). Member books are unassigned
        (their entries stay standalone); the series row is removed.
      operationId: deleteSeries
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/series/{id}/members:
    put:
      tags: [series]
      summary: |
        Replace the member set + order of a series in one call: the
        listed books (in order) become volumes 1..N; former members not
        listed are unassigned. The caller must manage the series and
        every listed book.
      operationId: putSeriesMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_ids]
              properties:
                book_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated series detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/files/{id}:
    get:
      tags: [files]
      summary: File detail with chapter titles and its book metadata
      operationId: getFile
      description: |
        Returns the chapter directory saved with the content at creation.
        Chapter-mode plugins declare the complete chapter list when content is
        created; the server saves that declaration with the content. For file-mode
        content, chapter titles and TOC are parsed and saved during creation.
        Reading never queries the plugin or starts downloads. Only an explicit
        user refresh updates the directory.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File detail with persisted chapter titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [files]
      summary: Toggle upload visibility or rename the edition label (owner or admin)
      description: |
        Plugin content is always public, even when its format is epub or txt.
        Setting a plugin item to private returns 400 without applying any changes.
      operationId: patchFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchFile"
      responses:
        "200":
          description: Updated file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [files]
      summary: Delete a file (owner or admin)
      operationId: deleteFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/files/{id}/chapters/{idx}:
    get:
      tags: [files]
      summary: Fetch one chapter's content
      description: |
        Returns only persisted chapter content, without fetching from the source
        or waiting for background downloads. Acquisition and explicit user refresh
        download content separately. Returns 404 if a row or its body is not yet
        stored, including pending or failed downloads. A stored empty body is valid.
      operationId: getChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - name: idx
          in: path
          required: true
          description: Zero-based chapter index
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Chapter content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


  /api/files/{id}/chapters/{idx}/retry:
    post:
      tags: [files]
      summary: Retry a missing chapter body
      description: |
        Explicit user action, available to authenticated users who can read the file.
        Returns an already stored body unchanged (including empty bodies). Otherwise
        downloads and persists the declared chapter before returning it, sharing
        in-flight downloads and the acquisition concurrency limit. Chapter-mode
        retries preserve other cached bodies without refreshing metadata or titles.
        File-mode retries rebuild the parsed book through the retained original or
        declared file provider, using the same loader as acquisition.
        Undeclared indices return 404 without contacting the source. Public share
        reads remain storage-only and cannot initiate retries.
      operationId: retryChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - name: idx
          in: path
          required: true
          description: Zero-based stored chapter index
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Persisted chapter content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Content download failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/images/{id}:
    get:
      tags: [files]
      summary: A localized chapter image (public, no auth)
      description: |
        Serves an illustration that plugin chapter text referenced; the
        host downloaded it at materialization time and rewrote the
        chapter HTML to this endpoint. `id` is the sha256 of the image
        bytes (unguessable, same capability-like model as book covers —
        `<img>` tags cannot send the Authorization header).
      operationId: getImage
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: "[0-9a-f]{64}"}
      responses:
        "200":
          description: The image bytes
          content:
            image/*:
              schema: {type: string, format: binary}
        "404":
          description: Unknown image id

  /api/files/{id}/download:
    get:
      tags: [files]
      summary: Download the retained original file bytes
      operationId: downloadFile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The original bytes (epub or txt)
          content:
            application/epub+zip:
              schema: {type: string, format: binary}
            text/plain:
              schema: {type: string, format: binary}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No original retained for this file

  /api/files/{id}/rematerialize:
    post:
      tags: [files]
      summary: |
        Clear stored chapter bodies (owner/admin only) and reload them in
        the background using the acquisition-time content form. Uploads use
        the retained original; plugin content uses the declared provider. The retry path for degraded materializations — e.g. images
        that fell back to remote URLs because the download failed; the
        re-pull stores them via the plugin's store-image import.
      operationId: rematerializeFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: The updated file (bodies cleared)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions:
    get:
      tags: [sessions]
      summary: List user-wide reading contexts (oldest first)
      operationId: listAllSessions
      security:
        - bearerAuth: []
      description: Account creation creates one ordinary context. All contexts are deletable; listing an empty collection does not create a replacement. New contexts start empty.
      responses:
        "200":
          description: Reading contexts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [sessions]
      summary: Create a context or reuse the same label
      operationId: createSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSession"
      responses:
        "201":
          description: Created or existing context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/files/{id}/sessions:
    get:
      tags: [sessions]
      summary: List existing per-file progress across contexts
      operationId: listSessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Per-file progress; untouched contexts are omitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions/{id}:
    delete:
      tags: [sessions]
      summary: Delete an owned context and all its progress
      operationId: deleteSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions/{id}/progress:
    get:
      tags: [sessions]
      summary: List all file progress in a context owned by the caller
      operationId: listProgress
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      description: Map file ids through visible book lists before displaying progress.
      responses:
        "200":
          description: Progress in this context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions/{id}/files/{file_id}/progress:
    put:
      tags: [sessions]
      summary: Create or update only this file progress (clamped)
      operationId: updateProgress
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePosition"
      description: Omitted fields retain the current position, or zero for an untouched file. Only the owner can write; file visibility is enforced.
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/sessions/{id}/files/{file_id}/sync:
    post:
      tags: [sessions]
      summary: Copy this file progress from another owned context
      operationId: syncProgress
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      description: Explicitly overwrite the target position, including backwards moves. No other file or source progress changes. A missing source progress returns 404; copying to the same context returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncProgress"
      responses:
        "200":
          description: Copied progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/files/{id}/shares:
    post:
      tags: [shares]
      summary: Share selected content versions of a book or one reading session
      description: |
        All selected files must belong to the same book and be shareable by the caller.
        Selection is frozen when the link is created; new versions are never included automatically.
        The path file is the default version and must be selected. Deleting that file revokes the link.
      operationId: createShare
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShare"
      responses:
        "201":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/shares/{token}:
    get:
      tags: [shares]
      summary: Public share info (no auth; session progress snapshot)
      operationId: getShare
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Share snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareView"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [shares]
      summary: Delete a share (creator or admin)
      operationId: deleteShare
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/shares/{token}/book:
    get:
      tags: [shares]
      summary: "Anonymous read: book, file and chapter titles"
      operationId: shareBook
      description: |
        Returns the same creation-time chapter directory as the file detail endpoint.
        The plugin declares the chapter list when content is created, and the server
        saves it with the content; file-mode directories are parsed at creation.
        This anonymous read never queries the plugin or starts downloads.
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: file_id
          in: query
          description: Selected shared content id; defaults to the original file. Unselected files return 404.
          schema:
            type: string
      responses:
        "200":
          description: Book + file + chapter titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareBookResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/shares/{token}/chapters/{idx}:
    get:
      tags: [shares]
      summary: "Anonymous read: one chapter"
      operationId: shareChapter
      description: |
        Returns only persisted chapter content, without fetching from its source or
        waiting for a download. Returns 404 if the row or its body is not stored.
        A stored empty body is valid. Anonymous reads cannot trigger a refresh.
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - name: file_id
          in: query
          description: Selected shared content id; defaults to the original file. Unselected files return 404.
          schema:
            type: string
        - name: idx
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Chapter content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    BookId:
      name: id
      in: path
      required: true
      description: Book (metadata) id
      schema:
        type: string
    FileId:
      name: id
      in: path
      required: true
      description: Book file id
      schema:
        type: string
    SeriesId:
      name: id
      in: path
      required: true
      description: Series id
      schema:
        type: string
    ShareToken:
      name: token
      in: path
      required: true
      description: Share token
      schema:
        type: string
    PluginId:
      name: id
      in: path
      required: true
      description: Plugin instance id (source id)
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Structured config validation errors (field-by-field for inline form display)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist (or share expired)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ValidationErrorResponse:
      description: Plugin configuration validation failure with field-level details.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/ConfigError"

    Health:
      type: object
      required: [status, version, allow_register]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        allow_register:
          type: boolean

    Role:
      type: string
      enum: [admin, user]

    User:
      type: object
      required: [id, username, role, created_at]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time

    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 'JWT (send as `Authorization: Bearer <token>`)'
        user:
          $ref: "#/components/schemas/User"

    Visibility:
      type: string
      enum: [private, public]

    BookMeta:
      type: object
      required: [id, title, authors, description, cover_url, ext, created_by, created_at, series_id, volume_no]
      properties:
        id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        description:
          type: [string, "null"]
        cover_url:
          type: [string, "null"]
        ext:
          $ref: "#/components/schemas/BookExt"
        created_by:
          description: Id of the user who created this metadata entry
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        series_id:
          description: |
            Series this book is a volume of (null = standalone). Plugins
            return parent metadata for independently identified books;
            manual assignment (`PATCH /api/books/{id}`) moves books
            in and out of series.
          type: [string, "null"]
        volume_no:
          description: 1-based volume ordinal inside the series (0 = standalone)
          type: integer
          minimum: 0

    BookExt:
      type: object
      description: |
        Extended book metadata (bangumi/douban-style). Every known key is
        optional; `null`/absent = unset. Unknown keys are preserved
        verbatim so future server fields round-trip through old clients.
        `isbn` is stored canonically as a hyphenless ISBN-13 (valid
        ISBN-10 inputs are converted); invalid ISBNs are rejected with
        400.
      properties:
        subtitle:
          description: 副标题
          type: [string, "null"]
        original_title:
          description: 原作名
          type: [string, "null"]
        isbn:
          description: Canonical hyphenless ISBN-13
          type: [string, "null"]
        publisher:
          description: 出版社
          type: [string, "null"]
        pub_date:
          description: 出版时间 (stored exactly as supplied)
          type: [string, "null"]
        translators:
          description: 译者
          type: [array, "null"]
          items:
            type: string
        illustrators:
          description: 插画师
          type: [array, "null"]
          items:
            type: string
        pages:
          description: 页数
          type: [integer, "null"]
          minimum: 0
        price:
          description: 定价 (currency as printed)
          type: [string, "null"]
        binding:
          description: 装帧 (文库/单行本/…)
          type: [string, "null"]
        language:
          description: BCP-47 language hint ("zh-CN", "ja")
          type: [string, "null"]
      additionalProperties: true

    SeriesExt:
      type: object
      description: |
        Extended series metadata: edition-independent facts of the
        publication family. Same rules as `BookExt` (all optional,
        unknown keys preserved).
      properties:
        original_title:
          description: 原作名
          type: [string, "null"]
        publisher:
          description: 出版社
          type: [string, "null"]
        pub_date:
          description: 首卷发售时间 (verbatim)
          type: [string, "null"]
        language:
          description: BCP-47 language hint
          type: [string, "null"]
        status:
          description: Publication status
          type: [string, "null"]
          enum: [ongoing, completed, hiatus]
        total_volumes:
          description: Planned volume count
          type: [integer, "null"]
          minimum: 0
        tags:
          description: 类型标签
          type: [array, "null"]
          items:
            type: string
      additionalProperties: true

    FileMeta:
      type: object
      description: |
        One independently selectable content item of a book. Source identity
        is immutable; add or delete an item instead of changing its source.
        Items whose source is not local are always public, regardless of format.
      required:
        - id
        - book_id
        - source
        - external_id
        - format
        - label
        - visibility
        - owner_id
        - chapter_count
        - created_at
        - content_mode
      properties:
        id:
          type: string
        book_id:
          type: string
        source:
          description: "'local' for uploads, otherwise the plugin id"
          type: string
        external_id:
          description: Id within the source (same as `id` for local files)
          type: string
        format:
          type: string
          enum: [epub, txt, plugin]
        label:
          description: Short human label for this edition
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        owner_id:
          type: [string, "null"]
        chapter_count:
          type: integer
        created_at:
          type: string
          format: date-time
        content_mode:
          description: Immutable content form declared at acquisition; uploads provide files.
          type: string
          enum: [chapters, file]
        original:
          description: |
            Retained original file bytes (`data/files/`, served by
            `GET /api/files/{id}/download`). null = plugin chapter-mode
            files and uploads made before original retention.
          type: object
          nullable: true
          required: [ext, size, sha256]
          properties:
            ext:
              description: File extension without the dot (epub / txt)
              type: string
            size:
              type: integer
            sha256:
              type: string

    ChapterMeta:
      type: object
      required: [idx, title]
      properties:
        idx:
          type: integer
        title:
          type: string
        linear:
          type: boolean
          default: true
          description: >
            False for auxiliary EPUB documents. They remain addressable by
            TOC/internal links but are excluded from default previous/next
            navigation and reading-progress denominators. Missing means true
            for older servers. Linear documents come first in spine order.

    TocNode:
      type: object
      description: >-
        One node of the hierarchical table of contents. `idx` is the
        chapter index this entry points to (`null` for pure group nodes);
        leaf entries reference entries of the `chapters` list.
      required: [title, idx, children]
      properties:
        title:
          type: string
        idx:
          type: [integer, "null"]
        frag:
          type: string
          nullable: true
          description: >
            Id fragment of the source href (`file.html#section`) when this
            entry points into the middle of its chapter; the reader
            scrolls to the element with that id.
        children:
          type: array
          items:
            $ref: "#/components/schemas/TocNode"

    Chapter:
      type: object
      required: [idx, title, content]
      properties:
        idx:
          type: integer
        title:
          type: string
        content:
          type: string
          description: |
            Sanitized HTML. Text/plugin chapters and legacy EPUB imports
            are fragments. Newly parsed EPUB chapters are full documents
            beginning with <!doctype html>, with passive publication CSS,
            SVG/MathML and rewritten local resources. Render full documents
            only in a sandboxed frame WITHOUT allow-scripts and with a CSP
            blocking network access except /api/images/, inline styles and
            embedded data images/fonts. Never insert publication CSS in the
            application DOM. html[data-epub-layout] retains the resolved OPF
            rendition layout (reflowable or pre-paginated).
            Internal document links use epub:chapter/{idx} with an optional
            percent-encoded fragment. Dispatch these to the matching chapter
            from the same file; local fragments stay #fragment. External
            HTTP(S)/mailto links require an explicit user click and must not
            navigate the application or publication frame.

    Position:
      type: object
      required: [chapter_idx, in_chapter]
      properties:
        chapter_idx:
          type: integer
          minimum: 0
        in_chapter:
          oneOf:
            - type: object
              required: [fraction]
              properties:
                fraction:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: Scroll fraction within the chapter (web reader)
            - type: object
              required: [offset]
              properties:
                offset:
                  type: integer
                  minimum: 0
                  description: Character offset within the chapter (non-web readers)

    SeriesMeta:
      type: object
      description: Metadata shared by series summaries and member book entries.
      required: [id, title, authors, description, cover_url, ext, created_by, created_at]
      properties:
        id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        description:
          type: [string, "null"]
        cover_url:
          type: [string, "null"]
        ext:
          $ref: "#/components/schemas/SeriesExt"
        created_by:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time

    SeriesBrief:
      description: Series metadata with the number of member books.
      allOf:
        - $ref: "#/components/schemas/SeriesMeta"
        - type: object
          required: [volume_count]
          properties:
            volume_count:
              description: Number of member books (all visibilities)
              type: integer
              minimum: 0

    SeriesDetail:
      type: object
      required: [series, books]
      properties:
        series:
          $ref: "#/components/schemas/SeriesBrief"
        books:
          description: Member books in volume order, files filtered by visibility
          type: array
          items:
            $ref: "#/components/schemas/BookEntry"

    AcquireResult:
      type: object
      description: |
        Result of one acquisition (`POST /api/books`). Exactly one volume
        book is acquired; series identifies its parent grouping when present.
      required: [series, books]
      properties:
        series:
          oneOf:
            - $ref: "#/components/schemas/SeriesBrief"
            - type: "null"
        books:
          type: array
          items:
            $ref: "#/components/schemas/BookEntry"

    BookEntry:
      type: object
      required: [book, files, series]
      properties:
        book:
          $ref: "#/components/schemas/BookMeta"
        files:
          description: Files of this book visible to the caller (empty for a metadata-only entry)
          type: array
          items:
            $ref: "#/components/schemas/FileMeta"
        series:
          description: Series this book belongs to (null = standalone)
          oneOf:
            - $ref: "#/components/schemas/SeriesMeta"
            - type: "null"

    FileDetail:
      type: object
      required: [file, book, chapters, toc]
      properties:
        file:
          $ref: "#/components/schemas/FileMeta"
        book:
          $ref: "#/components/schemas/BookMeta"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ChapterMeta"
        toc:
          type: array
          items:
            $ref: "#/components/schemas/TocNode"

    PatchBook:
      type: object
      description: >
        Metadata edit (creator or admin) plus optional series membership
        changes. `series_id`: a series id moves the book into it,
        explicit `null` unassigns, absent keeps the current series.
        `volume_no`: 1-based ordinal; absent/`null` = next free volume.
        Volume numbers within a series are unique (409 otherwise).
      properties:
        title:
          type: string
        description:
          type: string
        series_id:
          type: [string, "null"]
        volume_no:
          type: [integer, "null"]
          minimum: 1
        ext:
          description: Extended-metadata merge patch (absent = keep, null = clear, value = set)
          $ref: "#/components/schemas/BookExt"

    PatchFile:
      type: object
      properties:
        visibility:
          description: Only local uploads may be private; plugin items reject private with 400.
          $ref: "#/components/schemas/Visibility"
        label:
          type: string

    ReadingSession:
      type: object
      required: [id, user_id, label, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time

    ReadingProgress:
      type: object
      required: [id, session_id, user_id, file_id, label, position, updated_at]
      properties:
        id:
          type: string
          description: Stable per-file progress id, also used by legacy progress shares.
        session_id:
          type: string
          description: User-wide reading context id.
        user_id:
          type: string
        file_id:
          type: string
        label:
          type: string
        position:
          $ref: "#/components/schemas/Position"
        updated_at:
          type: string
          format: date-time

    SessionsResponse:
      type: object
      required: [file_id, sessions]
      properties:
        file_id:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ReadingProgress"

    CreateSession:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed label. Defaults to "default"; reuses the same label for this user.

    SyncProgress:
      type: object
      required: [source_session_id]
      properties:
        source_session_id:
          type: string

    UpdatePosition:
      type: object
      properties:
        chapter_idx:
          type: integer
          minimum: 0
        in_chapter:
          description: New chapter progress. Either a scroll fraction
            (`{fraction}`) or a character offset (`{offset}`) — the two
            channels are mutually exclusive.
          oneOf:
            - type: object
              required: [fraction]
              properties:
                fraction:
                  type: number
                  minimum: 0
                  maximum: 1
            - type: object
              required: [offset]
              properties:
                offset:
                  type: integer
                  minimum: 0

    ShareKind:
      type: string
      enum: [book, session]

    CreateShare:
      type: object
      properties:
        file_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
          description: Explicit content selection including the path file. Omit for a single-file link. Session shares allow only their own file.
        kind:
          $ref: "#/components/schemas/ShareKind"
        session_id:
          type: string
          description: Per-file ReadingProgress.id (not the context id), required when kind is "session"
        expires_days:
          type: integer
          minimum: 1

    ShareResponse:
      type: object
      required:
        - token
        - url
        - kind
        - file_id
        - session_id
        - expires_at
        - created_at
      properties:
        token:
          type: string
        url:
          description: Frontend path of the share page
          type: string
        kind:
          $ref: "#/components/schemas/ShareKind"
        file_id:
          type: string
        session_id:
          type: [string, "null"]
        expires_at:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time

    ShareBookView:
      type: object
      required: [id, title, authors, description, cover_url, ext]
      properties:
        id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        description:
          type: [string, "null"]
        cover_url:
          type: [string, "null"]
        ext:
          $ref: "#/components/schemas/BookExt"

    ShareFileView:
      type: object
      required: [id, format, label, chapter_count, source]
      properties:
        source:
          type: string
          description: Content source id (local for uploads, otherwise the plugin instance id)
        id:
          type: string
        format:
          type: string
          enum: [epub, txt, plugin]
        label:
          type: string
        chapter_count:
          type: integer

    ShareSessionView:
      type: object
      required: [id, label, owner_username, position, percent, updated_at]
      properties:
        id:
          type: string
        label:
          type: string
        owner_username:
          type: string
        position:
          $ref: "#/components/schemas/Position"
        percent:
          type: integer
          description: Progress within the current chapter, 0..100
        updated_at:
          type: string
          format: date-time

    ShareView:
      type: object
      required: [kind, book, file, files, session, created_at, expires_at]
      properties:
        files:
          type: array
          description: Only explicitly selected content versions; the default version comes first.
          items:
            $ref: "#/components/schemas/ShareFileView"
        kind:
          $ref: "#/components/schemas/ShareKind"
        book:
          $ref: "#/components/schemas/ShareBookView"
        file:
          $ref: "#/components/schemas/ShareFileView"
        session:
          oneOf:
            - $ref: "#/components/schemas/ShareSessionView"
            - type: "null"
          description: Present when kind is "session"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]

    ShareBookResponse:
      type: object
      required: [book, file, chapters, toc]
      properties:
        book:
          $ref: "#/components/schemas/ShareBookView"
        file:
          $ref: "#/components/schemas/ShareFileView"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ChapterMeta"
        toc:
          type: array
          items:
            $ref: "#/components/schemas/TocNode"

    PluginInstance:
      description: One registered plugin instance (source id = `id`)
      type: object
      required: [id, wasm_file, name, enabled, capabilities, source_info]
      properties:
        id:
          description: Source id used in `book_files.source`
          type: string
        wasm_file:
          description: Basename of the wasm component backing this instance
          type: string
        name:
          description: Human-readable plugin name (from the plugin itself)
          type: string
        enabled:
          type: boolean
        capabilities:
          description: >-
            Subset of [declare, search, lookup, identify, content, book-file].
            book-file instances materialize whole book files through the
            upload parser (file mode wins over chapter mode).
          type: array
          items:
            type: string
        source_info:
          description: |
            Interaction hints declared by the plugin (`source-info` export):
            how the frontend should present this source when acquiring
            books. `kind` = "search" | "manual-id" | "browse" | ""
            (empty = derive from capabilities).
          type: object
          required: [kind, id_kind]
          properties:
            kind:
              type: string
            id_kind:
              type: string
            id_hint:
              type: string
              nullable: true
            search_hint:
              type: string
              nullable: true

    ConfigField:
      description: One field of a plugin's configuration schema
      type: object
      required: [key, label, kind, required]
      properties:
        key:
          type: string
        label:
          description: zh-CN display label for the admin form
          type: string
        kind:
          type: string
          enum: [string, number, boolean, enum, list-of-string]
        options:
          description: Enum options (kind=enum); index is the stored value
          type: array
          items:
            type: string
        default:
          description: Serialized default value (JSON)
          type: string
          nullable: true
        required:
          type: boolean
        hint:
          type: string
          nullable: true

    ConfigSchema:
      description: Plugin config schema plus the stored values, for the admin form
      type: object
      required: [fields, config]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ConfigField"
        config:
          description: Current validated values keyed by field key
          type: object

    ConfigError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    PluginContentPreview:
      type: object
      required: [id, mode, chapter_count]
      properties:
        id:
          type: string
          description: Confirmed content ID, accepted by the content exports
        mode:
          type: string
          enum: [chapters, file]
        chapter_count:
          type: integer
          minimum: 0
          description: Declared chapter count; file-mode chapters are known after parsing

    PluginSearchItem:
      description: One search hit, annotated with the library book it is already synced into
      type: object
      required: [kind, id, title, authors, book_id]
      properties:
        kind:
          description: For book selection, open series hits through lookup to choose a member. For series selection, resolve the series itself through GET /api/plugins/{id}/series.
          type: string
          enum: [book, series]
        id:
          description: Opaque plugin-defined book or series ID
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true
        cover_url:
          type: string
          nullable: true
        book_id:
          description: Library metadata entry already materialized for this book, if any
          type: string
          nullable: true

    PluginSeriesLookupResponse:
      type: object
      required: [series, books]
      properties:
        series:
          allOf:
            - $ref: "#/components/schemas/PluginSearchItem"
            - type: object
              properties:
                kind: {type: string, const: series}
        books:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PluginSearchItem"
              - type: object
                properties:
                  kind: {type: string, const: book}
    ImportPluginSeries:
      type: object
      required: [series_id]
      properties:
        series_id:
          description: Opaque plugin series ID, not a member book ID or host UUID
          type: string
          minLength: 1
        book_ids:
          description: Explicit member book IDs to import as metadata only; omitted or empty imports only the series
          type: array
          default: []
          uniqueItems: true
          items: {type: string, minLength: 1}

    PluginSearchResponse:
      type: object
      required: [total, items]
      properties:
        total:
          description: Source-side total match count (may be capped by the source)
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/PluginSearchItem"
