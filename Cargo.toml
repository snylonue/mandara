[workspace]
resolver = "2"
members = [
    "plugins/wiki-plugin",
    "plugins/reader-plugin",
    "plugins/wenku8-plugin",
    "plugins/bangumi-plugin",
    "crates/bookshelf-core",
    "crates/bookshelf-formats",
    "crates/bookshelf-plugin",
    "crates/bookshelf-server",
    "plugins/hello-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/bookshelf"

# the wasm plugin (cdylib) is built size-optimized.
[profile.release.package.hello-plugin]
opt-level = "s"

[profile.release.package.wiki-plugin]
opt-level = "s"

[profile.release.package.reader-plugin]
opt-level = "s"

[profile.release.package.wenku8-plugin]
opt-level = "s"

[profile.release.package.bangumi-plugin]
opt-level = "s"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

# note: sqlx is used ONLY as the migration runner (sqlx::migrate!);
# all queries are Diesel DSL against a committed schema.rs (just schema).
diesel = { version = "2.3", features = ["sqlite"] }
diesel-async = { version = "0.9", features = ["sqlite", "deadpool", "sync-connection-wrapper"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
regex = "1"
encoding_rs = "0.8"
epub = "2.1"
scraper = "0.27"
wasmtime = "48"
mime = "0.3"
zip = "3.0"